name: Setup Node and pnpm
description: Install Node.js, activate pnpm through Corepack, and install workspace dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    required: true
  pnpm-version:
    description: pnpm version to activate.
    required: false
    default: 9.15.9
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@${{ inputs.pnpm-version }} --activate
        pnpm install --frozen-lockfile
