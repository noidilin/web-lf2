name: Resolve deploy environment
description: Resolve deployment environment settings for web-lf2.
inputs:
  requested-environment:
    description: Environment requested by the workflow trigger.
    required: true
outputs:
  environment:
    description: Canonical environment name.
    value: ${{ steps.resolve.outputs.environment }}
  infra-dir:
    description: Terragrunt live directory for the environment.
    value: ${{ steps.resolve.outputs.infra_dir }}
  aws-region:
    description: AWS region for the environment.
    value: ${{ steps.resolve.outputs.aws_region }}
  plan-role-arn:
    description: AWS IAM role ARN used for planning.
    value: ${{ steps.resolve.outputs.plan_role_arn }}
  apply-role-arn:
    description: AWS IAM role ARN used for applying.
    value: ${{ steps.resolve.outputs.apply_role_arn }}
runs:
  using: composite
  steps:
    - name: Resolve environment
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        REQUESTED_ENV="${{ inputs.requested-environment }}"

        case "$REQUESTED_ENV" in
          dev)
            environment=dev
            infra_dir=infra/live/dev
            aws_region=ap-northeast-1
            plan_role_arn=arn:aws:iam::549475122024:role/devops-web-lf2-dev-github-plan
            apply_role_arn=arn:aws:iam::549475122024:role/devops-web-lf2-dev-github-apply
            ;;
          prod)
            environment=prod
            infra_dir=infra/live/prod
            aws_region=ap-northeast-1
            plan_role_arn=arn:aws:iam::549475122024:role/devops-web-lf2-prod-github-plan
            apply_role_arn=arn:aws:iam::549475122024:role/devops-web-lf2-prod-github-apply
            ;;
          *)
            echo "Unsupported deployment environment: $REQUESTED_ENV" >&2
            exit 1
            ;;
        esac

        echo "environment=$environment" >> "$GITHUB_OUTPUT"
        echo "infra_dir=$infra_dir" >> "$GITHUB_OUTPUT"
        echo "aws_region=$aws_region" >> "$GITHUB_OUTPUT"
        echo "plan_role_arn=$plan_role_arn" >> "$GITHUB_OUTPUT"
        echo "apply_role_arn=$apply_role_arn" >> "$GITHUB_OUTPUT"
