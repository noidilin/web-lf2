name: Deploy lobby
description: Build or promote the lobby image, deploy the ECS service, and verify the deployed lobby contract.
inputs:
  infra-dir:
    description: Terragrunt live directory for the target environment.
    required: true
  aws-region:
    description: AWS region for ECR and ECS operations.
    required: true
  target-environment:
    description: Target deployment environment.
    required: true
  lobby-image-tag:
    description: Canonical sha-<40 hex> F.Lobby image tag to deploy.
    required: true
outputs:
  ecr-repository-name:
    description: ECR repository name for F.Lobby.
    value: ${{ steps.outputs.outputs.ecr_repository_name }}
  ecr-repository-url:
    description: ECR repository URL for F.Lobby.
    value: ${{ steps.outputs.outputs.ecr_repository_url }}
  ecs-cluster-name:
    description: Deployed lobby ECS cluster name.
    value: ${{ steps.refreshed.outputs.ecs_cluster_name }}
  ecs-service-name:
    description: Deployed lobby ECS service name.
    value: ${{ steps.refreshed.outputs.ecs_service_name }}
  lobby-url:
    description: Deployed lobby base URL.
    value: ${{ steps.refreshed.outputs.lobby_url }}
runs:
  using: composite
  steps:
    - name: Validate prod lobby image tag
      if: ${{ inputs.target-environment == 'prod' }}
      shell: bash
      env:
        LOBBY_IMAGE_TAG: ${{ inputs.lobby-image-tag }}
      run: |
        set -euo pipefail

        if [[ ! "$LOBBY_IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
          echo "lobby_image_tag must be canonical sha-<40 lowercase hex>; got '$LOBBY_IMAGE_TAG'" >&2
          exit 1
        fi

        echo "Promoting F.Lobby image tag $LOBBY_IMAGE_TAG"

    - name: Apply lobby networking
      shell: bash
      working-directory: ${{ inputs.infra-dir }}
      run: |
        terragrunt stack run apply --non-interactive --tf-forward-stdout \
          --queue-include-dir '.terragrunt-stack/networking' \
          --queue-strict-include

    - name: Apply lobby bootstrap
      shell: bash
      working-directory: ${{ inputs.infra-dir }}
      run: |
        terragrunt stack run apply --non-interactive --tf-forward-stdout \
          --queue-include-dir '.terragrunt-stack/lobby-bootstrap' \
          --queue-strict-include

    - name: Get lobby deployment outputs
      id: outputs
      shell: bash
      working-directory: ${{ inputs.infra-dir }}
      run: |
        set -euo pipefail

        ECR_URL=$(terragrunt stack output --format raw lobby-bootstrap.ecr_repository_url --non-interactive --no-stack-generate)
        ECR_NAME=$(terragrunt stack output --format raw lobby-bootstrap.ecr_repository_name --non-interactive --no-stack-generate)

        if [[ -z "$ECR_URL" || -z "$ECR_NAME" ]]; then
          echo "lobby-bootstrap ECR outputs are incomplete" >&2
          exit 1
        fi

        echo "ecr_repository_name=$ECR_NAME" >> "$GITHUB_OUTPUT"
        echo "ecr_repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"
        echo "ecr_registry=${ECR_URL%/*}" >> "$GITHUB_OUTPUT"

    - name: Build lobby image
      if: ${{ inputs.target-environment == 'dev' }}
      shell: bash
      run: |
        docker build \
          --tag "${{ steps.outputs.outputs.ecr_repository_url }}:${{ inputs.lobby-image-tag }}" \
          apps/lobby

    - name: Push lobby image
      if: ${{ inputs.target-environment == 'dev' }}
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail

        aws ecr get-login-password --region "${AWS_REGION}" \
          | docker login --username AWS --password-stdin "${{ steps.outputs.outputs.ecr_registry }}"

        if aws ecr describe-images \
          --repository-name "${{ steps.outputs.outputs.ecr_repository_name }}" \
          --image-ids "imageTag=${{ inputs.lobby-image-tag }}" >/dev/null 2>&1; then
          echo "Reusing existing immutable lobby image tag ${{ inputs.lobby-image-tag }}"
        else
          docker push "${{ steps.outputs.outputs.ecr_repository_url }}:${{ inputs.lobby-image-tag }}"
        fi

    - name: Verify promoted image exists in ECR
      if: ${{ inputs.target-environment == 'prod' }}
      shell: bash
      env:
        LOBBY_IMAGE_TAG: ${{ inputs.lobby-image-tag }}
      run: |
        set -euo pipefail

        if ! DIGEST=$(aws ecr describe-images \
          --repository-name "${{ steps.outputs.outputs.ecr_repository_name }}" \
          --image-ids "imageTag=${LOBBY_IMAGE_TAG}" \
          --query 'imageDetails[0].imageDigest' \
          --output text); then
          echo "F.Lobby image tag '$LOBBY_IMAGE_TAG' was not found in ECR repository '${{ steps.outputs.outputs.ecr_repository_name }}'" >&2
          exit 1
        fi

        if [[ -z "$DIGEST" || "$DIGEST" == "None" ]]; then
          echo "ECR did not return a digest for F.Lobby image tag '$LOBBY_IMAGE_TAG'" >&2
          exit 1
        fi

        echo "Verified existing F.Lobby image ${{ steps.outputs.outputs.ecr_repository_url }}:${LOBBY_IMAGE_TAG}@$DIGEST"

    - name: Promote lobby image alias
      shell: bash
      env:
        LOBBY_IMAGE_TAG: ${{ inputs.lobby-image-tag }}
        TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
      run: |
        set -euo pipefail

        MANIFEST=$(aws ecr batch-get-image \
          --repository-name "${{ steps.outputs.outputs.ecr_repository_name }}" \
          --image-ids "imageTag=${LOBBY_IMAGE_TAG}" \
          --query 'images[0].imageManifest' \
          --output text)

        if [[ -z "$MANIFEST" || "$MANIFEST" == "None" ]]; then
          echo "ECR did not return a manifest for F.Lobby image tag '$LOBBY_IMAGE_TAG'" >&2
          exit 1
        fi

        aws ecr put-image \
          --repository-name "${{ steps.outputs.outputs.ecr_repository_name }}" \
          --image-tag "${TARGET_ENVIRONMENT}" \
          --image-manifest "$MANIFEST" >/dev/null

        echo "Updated mutable ECR observability alias ${TARGET_ENVIRONMENT} -> $LOBBY_IMAGE_TAG"

    - name: Terragrunt apply lobby service
      shell: bash
      working-directory: ${{ inputs.infra-dir }}
      run: |
        terragrunt stack run apply --non-interactive --tf-forward-stdout \
          --queue-include-dir '.terragrunt-stack/networking' \
          --queue-include-dir '.terragrunt-stack/lobby-service' \
          --queue-strict-include

    - name: Refresh lobby outputs
      id: refreshed
      shell: bash
      working-directory: ${{ inputs.infra-dir }}
      run: |
        set -euo pipefail

        SERVICE_OUTPUTS=$(terragrunt stack output --format json lobby-service --non-interactive --no-stack-generate)
        CLUSTER=$(jq -r '."lobby-service".ecs_cluster_name // empty' <<< "$SERVICE_OUTPUTS")
        SERVICE=$(jq -r '."lobby-service".ecs_service_name // empty' <<< "$SERVICE_OUTPUTS")
        LOBBY_URL=$(jq -r '."lobby-service".lobby_url // empty' <<< "$SERVICE_OUTPUTS")

        if [[ -z "$CLUSTER" || -z "$SERVICE" || -z "$LOBBY_URL" ]]; then
          echo "lobby-service outputs are incomplete" >&2
          echo "$SERVICE_OUTPUTS" >&2
          exit 1
        fi

        echo "ecs_cluster_name=$CLUSTER" >> "$GITHUB_OUTPUT"
        echo "ecs_service_name=$SERVICE" >> "$GITHUB_OUTPUT"
        echo "lobby_url=$LOBBY_URL" >> "$GITHUB_OUTPUT"

    - name: Wait for service stability
      shell: bash
      run: |
        aws ecs wait services-stable \
          --cluster "${{ steps.refreshed.outputs.ecs_cluster_name }}" \
          --services "${{ steps.refreshed.outputs.ecs_service_name }}"

    - name: Run deployed lobby contract checks
      shell: bash
      env:
        LOBBY_BASE_URL: ${{ steps.refreshed.outputs.lobby_url }}
      run: node --test tests/deployed-lobby-contract.test.mjs
