name: Deploy Static Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'assets/**'
      - 'scripts/**'
      - 'infra/catalog/modules/static-site/**'
      - 'infra/catalog/units/static-site/**'
      - 'infra/live/dev/terragrunt.stack.hcl'
      - 'infra/live/root.hcl'
      - 'tests/**'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Queue dev static deploys instead of canceling in-flight runs. This workflow
# applies Terraform, syncs S3 with --delete, and invalidates CloudFront, so a
# newer push should wait for the current mutation to finish cleanly.
concurrency:
  group: deploy-static-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  NODE_VERSION: "22"
  LOBBY_BASE_URL: https://dev.lf2-lobby.noidilin.dev

jobs:
  deploy-static:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build static artifact
        run: npm run build:static

      - name: Check static artifact
        run: npm run check:static

      - name: Run static unit tests
        run: node --test tests/build-static.test.mjs tests/check-static.test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::549475122024:role/devops-web-lf2-dev-github-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform and Terragrunt
        uses: gruntwork-io/terragrunt-action@v3

      - name: Terragrunt apply static site
        working-directory: infra/live/dev
        run: terragrunt stack run apply --non-interactive --tf-forward-stdout --queue-include-dir '.terragrunt-stack/static-site' --queue-strict-include

      - name: Get deployment outputs
        id: outputs
        working-directory: infra/live/dev
        run: |
          set -euo pipefail

          BUCKET=$(terragrunt stack output --raw static-site.bucket_name --non-interactive --queue-include-dir '.terragrunt-stack/static-site' --queue-strict-include)
          DIST_ID=$(terragrunt stack output --raw static-site.cloudfront_distribution_id --non-interactive --queue-include-dir '.terragrunt-stack/static-site' --queue-strict-include)
          GAME_URL=$(terragrunt stack output --raw static-site.game_url --non-interactive --queue-include-dir '.terragrunt-stack/static-site' --queue-strict-include)

          if [[ -z "$BUCKET" ]]; then
            echo "Static site bucket_name output is empty" >&2
            exit 1
          fi

          echo "bucket_name=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "game_url=$GAME_URL" >> "$GITHUB_OUTPUT"

      - name: Sync static artifact to S3
        run: |
          aws s3 sync dist/static/ "s3://${{ steps.outputs.outputs.bucket_name }}/" \
            --delete \
            --cache-control "max-age=86400"

      - name: Invalidate CloudFront cache
        if: steps.outputs.outputs.distribution_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths "/*"

      - name: Run deployed smoke test
        if: steps.outputs.outputs.game_url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.outputs.outputs.game_url }}
          LOBBY_BASE_URL: ${{ env.LOBBY_BASE_URL }}
        run: npx playwright test --config playwright.deployed.config.mjs
