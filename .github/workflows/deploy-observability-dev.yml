name: Deploy Observability Dev

on:
  workflow_call:
    inputs:
      orchestrated:
        description: 'Use the parent Deploy Dev workflow as the dev deployment concurrency owner.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Standalone dispatches share the dev deployment queue. Calls from Deploy Dev
# get a per-run group because the parent workflow owns the cross-workflow queue.
concurrency:
  group: ${{ inputs.orchestrated && format('deploy-dev-{0}-observability', github.run_id) || 'deploy-dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy-observability-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@633526dcc9c26211a4282d6d8de3d8b5cb7ad07b
        with:
          role-to-assume: arn:aws:iam::549475122024:role/devops-web-lf2-dev-github-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform and Terragrunt
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a

      - name: Terragrunt apply observability
        working-directory: infra/live/dev
        run: |
          terragrunt stack run apply --non-interactive --tf-forward-stdout \
            --queue-include-dir '.terragrunt-stack/observability' \
            --queue-strict-include

      - name: Show observability outputs
        working-directory: infra/live/dev
        run: terragrunt stack output --format json observability --non-interactive --no-stack-generate
