name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      lobby_image_tag:
        description: 'Optional canonical sha-<40 hex> F.Lobby image tag to promote. Defaults to selected ref SHA.'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

# Production deployments are manually dispatched and queued so only one release
# can promote the shared prod AWS baseline at a time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-lobby-prod:
    uses: ./.github/workflows/deploy-lobby-prod.yml
    with:
      orchestrated: true
      lobby_image_tag: ${{ inputs.lobby_image_tag }}

  deploy-static-prod:
    needs: deploy-lobby-prod
    uses: ./.github/workflows/deploy-static-prod.yml
    with:
      orchestrated: true

  deploy-observability-prod:
    needs: deploy-static-prod
    uses: ./.github/workflows/deploy-observability-prod.yml
    with:
      orchestrated: true
