name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed environments
        id: detect
        run: |
          # Default to both environments for now
          # In future, detect which env dirs changed
          echo "environments=[\"dev\",\"prod\"]" >> "$GITHUB_OUTPUT"

  terraform-plan:
    needs: detect-environment
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-environment.outputs.environments) }}
    runs-on: ubuntu-latest
    env:
      TF_VERSION: "1.15.*"
      TG_VERSION: "0.95.0"
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::549475122024:role/devops-web-lf2-${{ matrix.environment }}-github-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}

      - name: Terragrunt format check
        working-directory: infra
        run: terragrunt hcl format --check --diff

      - name: Terraform format check
        working-directory: infra
        run: |
          find catalog/modules -name "*.tf" -exec terraform fmt -check -diff {} \;

      - name: Terragrunt validate
        working-directory: infra/live/${{ matrix.environment }}
        run: terragrunt stack run validate --non-interactive

      - name: Terragrunt plan
        working-directory: infra/live/${{ matrix.environment }}
        run: |
          set -o pipefail
          terragrunt stack run plan --non-interactive --tf-forward-stdout --out-dir plan-out | tee plan.txt

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/live/${{ matrix.environment }}/plan.txt', 'utf8');
            const body = `## Terraform Plan: \`${{ matrix.environment }}\`\n\n\`\`\`diff\n${plan.substring(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
