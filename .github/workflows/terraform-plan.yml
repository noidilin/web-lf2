name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

# PR plans are read-only and become stale after a new push, so cancel older runs
# for the same PR to reduce duplicate plan comments and wasted CI time.
concurrency:
  group: terraform-plan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed environments
        id: detect
        run: |
          # Default to both environments for now
          # In future, detect which env dirs changed
          echo "environments=[\"dev\",\"prod\"]" >> "$GITHUB_OUTPUT"

  terraform-plan:
    needs: detect-environment
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-environment.outputs.environments) }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      LOBBY_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::549475122024:role/devops-web-lf2-${{ matrix.environment }}-github-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform and Terragrunt
        uses: gruntwork-io/terragrunt-action@v3

      - name: Terragrunt format check
        working-directory: infra
        run: terragrunt hcl format --check --diff

      - name: Terraform format check
        working-directory: infra
        run: |
          find catalog/modules -name "*.tf" -exec terraform fmt -check -diff {} \;

      - name: Terragrunt validate
        working-directory: infra/live/${{ matrix.environment }}
        run: terragrunt stack run validate --non-interactive

      - name: Terragrunt plan
        working-directory: infra/live/${{ matrix.environment }}
        run: |
          set -o pipefail
          terragrunt stack run plan --non-interactive --tf-forward-stdout --queue-exclude-dir '.terragrunt-stack/deployment-identity' --out-dir plan-out | tee plan.txt

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/live/${{ matrix.environment }}/plan.txt', 'utf8');
            const body = `## Terraform Plan: \`${{ matrix.environment }}\`\n\n\`\`\`diff\n${plan.substring(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
