name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            infra_dir: infra/live/dev
            aws_region: ap-northeast-1
            plan_role_arn: arn:aws:iam::549475122024:role/devops-web-lf2-dev-github-plan
          - environment: prod
            infra_dir: infra/live/prod
            aws_region: ap-northeast-1
            plan_role_arn: arn:aws:iam::549475122024:role/devops-web-lf2-prod-github-plan
    runs-on: ubuntu-latest
    env:
      LOBBY_IMAGE_TAG: sha-${{ github.sha }}
      PLAN_FILE: ${{ runner.temp }}/${{ matrix.environment }}-plan.txt
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ matrix.plan_role_arn }}
          aws-region: ${{ matrix.aws_region }}

      - name: Setup Terraform and Terragrunt
        uses: gruntwork-io/terragrunt-action@v3.4.0

      - name: Terragrunt format check
        run: terragrunt hcl format --check --diff --working-dir infra

      - name: Terraform format check
        run: find infra/catalog/modules -name "*.tf" -exec terraform fmt -check -diff {} \;

      - name: Terragrunt validate
        working-directory: ${{ matrix.infra_dir }}
        run: |
          terragrunt stack run validate --non-interactive --tf-forward-stdout \
            --queue-exclude-dir '.terragrunt-stack/deployment-identity'

      - name: Terragrunt plan
        id: plan
        working-directory: ${{ matrix.infra_dir }}
        continue-on-error: true
        run: |
          set -o pipefail
          terragrunt stack run plan --non-interactive --tf-forward-stdout \
            --queue-exclude-dir '.terragrunt-stack/deployment-identity' \
            | tee "$PLAN_FILE"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.environment }}-terraform-plan
          path: ${{ env.PLAN_FILE }}
          if-no-files-found: error

      - name: Update sticky PR plan comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_FILE: ${{ env.PLAN_FILE }}
          PLAN_STATUS: ${{ steps.plan.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');

            const marker = `<!-- web-lf2-terraform-plan:${process.env.ENVIRONMENT} -->`;
            const rawPlan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : '(plan output file was not created)';
            const stripped = rawPlan.replace(/\u001b\[[0-9;]*m/g, '');
            const truncated = stripped.length > 60000
              ? `${stripped.slice(0, 60000)}\n\n...truncated; download the artifact for the full plan.`
              : stripped;
            const body = `${marker}\n## Terraform Plan: \`${process.env.ENVIRONMENT}\`\n\n` +
              `- Commit: \`${process.env.COMMIT_SHA}\`\n` +
              `- Plan status: \`${process.env.PLAN_STATUS}\`\n` +
              `- Full output: download the \`${process.env.ENVIRONMENT}-terraform-plan\` workflow artifact.\n\n` +
              '```diff\n' + truncated + '\n```';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on plan error
        if: steps.plan.outcome != 'success'
        run: exit 1
