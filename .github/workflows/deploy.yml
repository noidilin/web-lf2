name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/**'
      - 'assets/**'
      - 'scripts/**'
      - 'infra/catalog/modules/deployment-identity/**'
      - 'infra/catalog/modules/lobby-bootstrap/**'
      - 'infra/catalog/modules/lobby-service/**'
      - 'infra/catalog/modules/networking/**'
      - 'infra/catalog/modules/observability/**'
      - 'infra/catalog/modules/static-site/**'
      - 'infra/catalog/units/lobby-bootstrap/**'
      - 'infra/catalog/units/lobby-service/**'
      - 'infra/catalog/units/networking/**'
      - 'infra/catalog/units/observability/**'
      - 'infra/catalog/units/static-site/**'
      - 'infra/live/dev/terragrunt.stack.hcl'
      - 'infra/live/prod/terragrunt.stack.hcl'
      - 'infra/live/root.hcl'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy.'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      lobby_image_tag:
        description: 'Optional canonical sha-<40 hex> F.Lobby image tag for prod promotion. Defaults to selected ref SHA.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      infra_dir: ${{ steps.resolve.outputs.infra-dir }}
      aws_region: ${{ steps.resolve.outputs.aws-region }}
      plan_role_arn: ${{ steps.resolve.outputs.plan-role-arn }}
      apply_role_arn: ${{ steps.resolve.outputs.apply-role-arn }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve environment
        id: resolve
        uses: ./.github/actions/resolve-deploy-environment
        with:
          requested-environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

  preflight:
    needs: resolve-environment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.resolve-environment.outputs.aws_region }}
      INFRA_DIR: ${{ needs.resolve-environment.outputs.infra_dir }}
      LOBBY_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run app and workflow checks
        run: |
          pnpm run build:static
          pnpm run check:static
          node --test tests/build-static.test.mjs tests/check-static.test.mjs tests/deploy-workflow.test.mjs tests/lobby-hardening.test.mjs tests/lobby-infrastructure.test.mjs tests/observability.test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ needs.resolve-environment.outputs.plan_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup IaC tools
        uses: ./.github/actions/setup-iac-tools

      - name: Run IaC preflight
        uses: ./.github/actions/preflight-iac
        with:
          infra-dir: ${{ env.INFRA_DIR }}

  deploy:
    needs:
      - resolve-environment
      - preflight
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ needs.resolve-environment.outputs.aws_region }}
      INFRA_DIR: ${{ needs.resolve-environment.outputs.infra_dir }}
      TARGET_ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
      LOBBY_IMAGE_TAG: ${{ needs.resolve-environment.outputs.environment == 'prod' && github.event_name == 'workflow_dispatch' && inputs.lobby_image_tag || format('sha-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ needs.resolve-environment.outputs.apply_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup IaC tools
        uses: ./.github/actions/setup-iac-tools

      - name: Deploy lobby
        id: lobby
        uses: ./.github/actions/deploy-lobby
        with:
          infra-dir: ${{ env.INFRA_DIR }}
          aws-region: ${{ env.AWS_REGION }}
          target-environment: ${{ env.TARGET_ENVIRONMENT }}
          lobby-image-tag: ${{ env.LOBBY_IMAGE_TAG }}

      - name: Deploy static site
        id: static_site
        uses: ./.github/actions/deploy-static-site
        timeout-minutes: 45
        with:
          infra-dir: ${{ env.INFRA_DIR }}
          lobby-url: ${{ steps.lobby.outputs.lobby-url }}

      - name: Terragrunt apply observability
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          terragrunt stack run apply --non-interactive --tf-forward-stdout \
            --queue-include-dir '.terragrunt-stack/observability' \
            --queue-strict-include

      - name: Show observability outputs
        working-directory: ${{ env.INFRA_DIR }}
        run: terragrunt stack output --format json observability --non-interactive --no-stack-generate
