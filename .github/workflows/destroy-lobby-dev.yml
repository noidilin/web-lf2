name: Destroy Lobby Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Avoid racing deploy/destroy mutations against the same dev stack.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  destroy-lobby:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::549475122024:role/devops-web-lf2-dev-github-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform and Terragrunt
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3.4.0

      - name: Destroy lobby service
        working-directory: infra/live/dev
        run: |
          terragrunt stack run destroy --non-interactive --tf-forward-stdout \
            --queue-include-dir '.terragrunt-stack/lobby-service' \
            --queue-strict-include

      - name: Destroy lobby networking
        working-directory: infra/live/dev
        run: |
          terragrunt stack run destroy --non-interactive --tf-forward-stdout \
            --queue-include-dir '.terragrunt-stack/networking' \
            --queue-strict-include
